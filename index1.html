<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS Matrix Repo | ISO Downloader</title>
    <style>
        :root {
            --matrix-green: #00ff41;
            --dark-bg: #0a0a0a;
            --glass-bg: rgba(0, 20, 0, 0.8);
            --neon-glow: 0 0 10px #00ff41, 0 0 20px #00ff41;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--matrix-green);
            overflow-x: hidden;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            text-transform: uppercase;
        }

        h1 {
            font-size: 3rem;
            text-shadow: var(--neon-glow);
            margin-bottom: 1rem;
            letter-spacing: 5px;
        }

        .search-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        input, select {
            background: var(--glass-bg);
            border: 1px solid var(--matrix-green);
            color: var(--matrix-green);
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            outline: none;
            box-shadow: inset 0 0 5px var(--matrix-green);
            transition: 0.3s;
        }

        input:focus, select:focus {
            box-shadow: var(--neon-glow);
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--matrix-green);
            color: var(--matrix-green);
            padding: 0.5rem 1.5rem;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--matrix-green);
            color: black;
            box-shadow: var(--neon-glow);
        }

        .os-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .os-card {
            background: var(--glass-bg);
            border: 1px solid var(--matrix-green);
            padding: 1.5rem;
            text-align: center;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        .os-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--neon-glow);
            background: rgba(0, 40, 0, 0.9);
        }

        .os-card h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 5px var(--matrix-green);
        }

        .os-card p {
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            opacity: 0.8;
        }

        .download-btn {
            display: inline-block;
            background: var(--matrix-green);
            color: black;
            text-decoration: none;
            padding: 0.7rem 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
            border: 1px solid var(--matrix-green);
        }

        .download-btn:hover {
            background: transparent;
            color: var(--matrix-green);
            box-shadow: var(--neon-glow);
        }

        .hash-info {
            margin-top: 1rem;
            font-size: 0.7rem;
            color: rgba(0, 255, 65, 0.6);
            word-break: break-all;
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            padding: 2rem;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        .glitch {
            position: relative;
        }
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            left: 2px;
            text-shadow: -1px 0 red;
            top: 0;
            color: var(--matrix-green);
            background: var(--dark-bg);
            overflow: hidden;
            clip: rect(0, 900px, 0, 0);
            animation: noise-anim 2s infinite linear alternate-reverse;
        }

        @keyframes noise-anim {
            0% { clip: rect(10px, 9999px, 20px, 0); }
            20% { clip: rect(30px, 9999px, 40px, 0); }
            40% { clip: rect(50px, 9999px, 60px, 0); }
            60% { clip: rect(70px, 9999px, 80px, 0); }
            80% { clip: rect(90px, 9999px, 100px, 0); }
            100% { clip: rect(0, 9999px, 10px, 0); }
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <header>
            <h1 class="glitch" data-text="OS_MATRIX_REPO">OS_MATRIX_REPO</h1>
            <p>Acceso al repositorio de imágenes ISO oficiales</p>
        </header>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar sistema operativo...">
            <select id="sortSelect">
                <option value="name">Ordenar por nombre</option>
                <option value="newest">Más recientes</option>
            </select>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" data-filter="windows">Windows</button>
            <button class="filter-btn" data-filter="linux">Linux</button>
            <button class="filter-btn" data-filter="macos">macOS</button>
            <button class="filter-btn" data-filter="others">Otros</button>
        </div>

        <div class="os-grid" id="osGrid"></div>

        <footer>
            &copy; 2026 Matrix OS Repository - Acceso Encriptado - No tampering detected.
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$+-*/=%\"'#&_(),.;:?!\\|{}<>[]^~";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let x = 0; x < columns; x++) { drops[x] = 1; }
        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ff41";
            ctx.font = fontSize + "px Courier New";
            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) { drops[i] = 0; }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        const osData = [
            { name: "Windows 11 Pro", family: "windows", version: "23H2", hash: "SHA256: a1b2c3d4e5f6g7h8...", url: "#" },
            { name: "Windows 10 Home", family: "windows", version: "22H2", hash: "SHA256: z9y8x7w6v5u4t3s2...", url: "#" },
            { name: "Windows 7 Ultimate", family: "windows", version: "SP1", hash: "SHA256: m1n2o3p4q5r6s7t8...", url: "#" },
            { name: "Ubuntu 24.04 LTS", family: "linux", version: "Noble Numbat", hash: "SHA256: k8j7i6h5g4f3e2d1...", url: "#" },
            { name: "Debian 12", family: "linux", version: "Bookworm", hash: "SHA256: l1m2n3o4p5q6r7s8...", url: "#" },
            { name: "Kali Linux", family: "linux", version: "2024.1", hash: "SHA256: h7g6f5e4d3c2b1a0...", url: "#" },
            { name: "Arch Linux", family: "linux", version: "Latest", hash: "SHA256: p9o8i7u6y5t4r3e2...", url: "#" },
            { name: "macOS Sonoma", family: "macos", version: "14.0", hash: "SHA256: v1b2n3m4a5s6d7f8...", url: "#" },
            { name: "macOS Ventura", family: "macos", version: "13.0", hash: "SHA256: q1w2e3r4t5y6u7i8...", url: "#" },
            { name: "Haiku OS", family: "others", version: "Beta 4", hash: "SHA256: x1y2z3a4b5c6d7e8...", url: "#" },
            { name: "FreeBSD", family: "others", version: "14.0", hash: "SHA256: f1g2h3j4k5l6m7n8...", url: "#" },
        ];

        const osGrid = document.getElementById('osGrid');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');

        function renderOS(data) {
            osGrid.innerHTML = '';
            data.forEach(os => {
                const card = document.createElement('div');
                card.className = 'os-card';
                card.innerHTML = `
                    <h3>${os.name}</h3>
                    <p>Versión: ${os.version}</p>
                    <a href="${os.url}" class="download-btn">Descargar ISO</a>
                    <div class="hash-info">${os.hash}</div>
                `;
                osGrid.appendChild(card);
            });
        }

        function filterOS() {
            const searchTerm = searchInput.value.toLowerCase();
            const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
            const filtered = osData.filter(os => {
                const matchesSearch = os.name.toLowerCase().includes(searchTerm);
                const matchesFilter = activeFilter === 'all' || os.family === activeFilter;
                return matchesSearch && matchesFilter;
            });
            renderOS(filtered);
        }

        searchInput.addEventListener('input', filterOS);
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filterOS();
            });
        });
        renderOS(osData);
    </script>
</body>
</html>
