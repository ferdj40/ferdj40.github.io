<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS Matrix Repo | ISO Downloader</title>
    <style>
        :root {
            --matrix-green: #00ff41;
            --dark-bg: #0a0a0a;
            --glass-bg: rgba(0, 20, 0, 0.8);
            --neon-glow: 0 0 10px #00ff41, 0 0 20px #00ff41;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--matrix-green);
            overflow-x: hidden;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            text-transform: uppercase;
        }

        h1 {
            font-size: 3rem;
            text-shadow: var(--neon-glow);
            margin-bottom: 1rem;
            letter-spacing: 5px;
        }

        .search-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        input, select {
            background: var(--glass-bg);
            border: 1px solid var(--matrix-green);
            color: var(--matrix-green);
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            outline: none;
            box-shadow: inset 0 0 5px var(--matrix-green);
            transition: 0.3s;
        }

        input:focus, select:focus {
            box-shadow: var(--neon-glow);
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--matrix-green);
            color: var(--matrix-green);
            padding: 0.5rem 1.5rem;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--matrix-green);
            color: black;
            box-shadow: var(--neon-glow);
        }

        .os-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .os-card {
            background: var(--glass-bg);
            border: 1px solid var(--matrix-green);
            padding: 1.5rem;
            text-align: center;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        .os-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--neon-glow);
            background: rgba(0, 40, 0, 0.9);
        }

        .os-card h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 5px var(--matrix-green);
        }

        .os-card p {
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            opacity: 0.8;
        }

        .download-btn {
            display: inline-block;
            background: var(--matrix-green);
            color: black;
            text-decoration: none;
            padding: 0.7rem 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
            border: 1px solid var(--matrix-green);
        }

        .download-btn:hover {
            background: transparent;
            color: var(--matrix-green);
            box-shadow: var(--neon-glow);
        }

        .hash-info {
            margin-top: 1rem;
            font-size: 0.7rem;
            color: rgba(0, 255, 65, 0.6);
            word-break: break-all;
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            padding: 2rem;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        .hash-info a, .back-link {
            color: var(--matrix-green);
        }

        .glitch {
            position: relative;
        }
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            left: 2px;
            text-shadow: -1px 0 red;
            top: 0;
            color: var(--matrix-green);
            background: var(--dark-bg);
            overflow: hidden;
            clip: rect(0, 900px, 0, 0);
            animation: noise-anim 2s infinite linear alternate-reverse;
        }

        @keyframes noise-anim {
            0% { clip: rect(10px, 9999px, 20px, 0); }
            20% { clip: rect(30px, 9999px, 40px, 0); }
            40% { clip: rect(50px, 9999px, 60px, 0); }
            60% { clip: rect(70px, 9999px, 80px, 0); }
            80% { clip: rect(90px, 9999px, 100px, 0); }
            100% { clip: rect(0, 9999px, 10px, 0); }
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <header>
            <h1 class="glitch" data-text="OS_MATRIX_REPO">OS_MATRIX_REPO</h1>
            <p>Acceso al repositorio de imágenes ISO oficiales</p>
        </header>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar sistema operativo...">
            <select id="sortSelect">
                <option value="name">Ordenar por nombre</option>
                <option value="family">Ordenar por familia</option>
            </select>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" data-filter="windows">Windows</button>
            <button class="filter-btn" data-filter="linux">Linux</button>
        </div>

        <div class="os-grid" id="osGrid"></div>

        <footer>
            &copy; 2026 Matrix OS Repository - Acceso Encriptado - No tampering detected.
            <br><a href="index.html" class="back-link">&larr; Fer</a>
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$+-*/=%\"'#&_(),.;:?!\\|{}<>[]^~";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let x = 0; x < columns; x++) { drops[x] = 1; }
        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ff41";
            ctx.font = fontSize + "px Courier New";
            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) { drops[i] = 0; }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Enlaces oficiales y SHA256 copiados de los archivos de sumas de cada distribución.
        // Microsoft no publica el SHA256 de sus ISOs, así que Windows no lleva hash.
        const osData = [
            { name: "Windows 11", family: "windows", version: "Última versión",
              url: "https://www.microsoft.com/software-download/windows11",
              archivo: null, sha256: null, fuente: null },
            { name: "Windows 10", family: "windows", version: "22H2",
              url: "https://www.microsoft.com/software-download/windows10",
              archivo: null, sha256: null, fuente: null },
            { name: "Ubuntu", family: "linux", version: "26.04.1 LTS",
              url: "https://ubuntu.com/download/desktop",
              archivo: "ubuntu-26.04.1-desktop-amd64.iso",
              sha256: "601e30fbf5d97759367c632e2c33630665039b7e2158fd068403da3ccf1bda1f",
              fuente: "https://releases.ubuntu.com/26.04.1/SHA256SUMS" },
            { name: "Debian", family: "linux", version: "13.7.0",
              url: "https://www.debian.org/CD/",
              archivo: "debian-13.7.0-amd64-netinst.iso",
              sha256: "a7ef94ac2fb9a7fec454552abd629b7cc9d5155c886165a45649f5ce6167e355",
              fuente: "https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/SHA256SUMS" },
            { name: "Fedora Workstation", family: "linux", version: "44",
              url: "https://fedoraproject.org/workstation/download/",
              archivo: "Fedora-Workstation-Live-44-1.7.x86_64.iso",
              sha256: "1620295f6a00c27c3208f0c00b8ece4eab1ec69b9002152d97488bf26a426ddf",
              fuente: "https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Workstation/x86_64/iso/Fedora-Workstation-44-1.7-x86_64-CHECKSUM" },
            { name: "Linux Mint Cinnamon", family: "linux", version: "22.3",
              url: "https://linuxmint.com/download.php",
              archivo: "linuxmint-22.3-cinnamon-64bit.iso",
              sha256: "a081ab202cfda17f6924128dbd2de8b63518ac0531bcfe3f1a1b88097c459bd4",
              fuente: "https://mirrors.kernel.org/linuxmint/stable/22.3/sha256sum.txt" },
            { name: "Arch Linux", family: "linux", version: "2026.10.01",
              url: "https://archlinux.org/download/",
              archivo: "archlinux-2026.10.01-x86_64.iso",
              sha256: "684ded26c63240ff4a41e8c25ee84ea6da233f557364821f13d12c2b0a9059a5",
              fuente: "https://geo.mirror.pkgbuild.com/iso/latest/sha256sums.txt" },
            { name: "Kali Linux", family: "linux", version: "2026.3 (installer)",
              url: "https://www.kali.org/get-kali/",
              archivo: "kali-linux-2026.3-installer-amd64.iso",
              sha256: "db9cbed33edb45727d16911813c2434fcd1419585007884153be22a03b30ec2f",
              fuente: "https://cdimage.kali.org/current/SHA256SUMS" },
        ];

        const osGrid = document.getElementById('osGrid');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const filterBtns = document.querySelectorAll('.filter-btn');

        function renderOS(data) {
            osGrid.innerHTML = '';
            data.forEach(os => {
                const card = document.createElement('div');
                card.className = 'os-card';
                const hash = os.sha256
                    ? `SHA256: ${os.sha256}<br>${os.archivo}<br><a href="${os.fuente}" target="_blank" rel="noopener">archivo de sumas oficial</a>`
                    : 'SHA256: no publicado por el fabricante';
                card.innerHTML = `
                    <h3>${os.name}</h3>
                    <p>Versión: ${os.version}</p>
                    <a href="${os.url}" class="download-btn" target="_blank" rel="noopener">Descargar ISO</a>
                    <div class="hash-info">${hash}</div>
                `;
                osGrid.appendChild(card);
            });
        }

        function filterOS() {
            const searchTerm = searchInput.value.toLowerCase();
            const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
            const filtered = osData.filter(os => {
                const matchesSearch = os.name.toLowerCase().includes(searchTerm);
                const matchesFilter = activeFilter === 'all' || os.family === activeFilter;
                return matchesSearch && matchesFilter;
            });
            filtered.sort((a, b) => sortSelect.value === 'family'
                ? a.family.localeCompare(b.family) || a.name.localeCompare(b.name)
                : a.name.localeCompare(b.name));
            renderOS(filtered);
        }

        searchInput.addEventListener('input', filterOS);
        sortSelect.addEventListener('change', filterOS);
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filterOS();
            });
        });
        filterOS();
    </script>
</body>
</html>
