# Comprueba cada 6 h que el sitio responde; si falla, GitHub te envía un correo.
name: Uptime
on:
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --location "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" > /dev/null
